[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "vibe_sim"
version = "0.2.0"
description = "Research-grade macroeconomic simulation engine with double-entry bookkeeping"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["flask>=3.0"]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
all = ["vibe_sim[dashboard,dev]"]

[project.scripts]
vibe-sim = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*", "dashboard*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: minimal smoke test for CI",
]
