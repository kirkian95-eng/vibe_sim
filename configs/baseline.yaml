# VibeSim v0.2 baseline configuration
# Load with: engine.io.load_config_yaml("configs/baseline.yaml")

name: baseline
seed: 42
num_months: 120  # 10 years

# Population
num_individuals: 1000
owner_fraction: 0.01

# Firms
num_food_firms: 4
num_energy_firms: 3
num_shelter_firms: 3
num_healthcare_firms: 2

# Production (Cobb-Douglas)
food_productivity: 2.0
energy_productivity: 1.5
shelter_productivity: 0.8
healthcare_productivity: 5.0
labor_share: 0.7
capital_share: 0.3

# Initial endowments
initial_firm_cash: 50000.0
initial_firm_capital: 100.0
initial_firm_inventory: 50.0
initial_individual_cash: 500.0  # flat fallback; age-based used at creation
initial_savings_at_retirement: 40000.0  # target bank deposits at age 65
initial_bank_reserves: 500000.0

# Consumption needs (units/person/month)
food_need: 1.0
energy_need: 1.0
shelter_need: 1.0
child_food_fraction: 0.5

# Initial prices (per unit)
initial_food_price: 150.0
initial_energy_price: 120.0
initial_shelter_price: 600.0
# Shelter: temporarily govt-provided at fixed price (see markets.py TRADEOFF)
shelter_fixed_price: 600.0

# Wages (monthly)
initial_wage: 2400.0
min_wage: 600.0
wage_adjustment_speed: 0.06

# Price adjustment
price_adjustment_speed: 0.10
target_inventory_months: 2.0

# Government / fiscal
income_tax_rate: 0.20
sales_tax_rate: 0.05
monthly_govt_transfer: 300.0
monthly_govt_spending: 150000.0

# Banking
interest_rate: 0.05
reserve_requirement: 0.10

# Firm behavior
profit_distribution_rate: 0.50

# Demographics
retirement_age: 65
mortality_start_age: 72
target_death_age: 80
fertility_rate_annual: 0.01

# Pensions
pension_replacement_rate: 0.50

# Healthcare
childbirth_healthcare_fee: 5000.0
elder_healthcare_monthly_cost: 500.0

# Bonds
bond_duration_months: 120
bond_rate_min: 0.005
bond_rate_max: 0.15
bond_demand_sensitivity: 5.0
bond_savings_fraction: 0.3
