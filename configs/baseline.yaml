# VibeSim v0.2 baseline configuration
# Load with: engine.io.load_config_yaml("configs/baseline.yaml")

name: baseline
seed: 42
num_months: 120  # 10 years

# Population
num_individuals: 1000
owner_fraction: 0.01

# Firms
num_food_firms: 1
num_energy_firms: 1
num_shelter_firms: 1  # landlord firms that own and rent housing
num_healthcare_firms: 1

# Production (Cobb-Douglas) - calibrated for stable supply/demand balance
food_productivity: 2.25
energy_productivity: 2.25
shelter_productivity: 0.8
healthcare_productivity: 5.0
labor_share: 0.7
capital_share: 0.3
capital_depreciation_rate: 0.01  # monthly (~12% annual)
firm_investment_rate: 0.10  # demand-driven investment rate (fraction of K at full shortage)
firm_min_investment_rate: 0.01  # maintenance investment (= depreciation → zero net growth without demand)

# Initial endowments
initial_firm_cash: 200000.0  # enough for demand-driven cold start (~95% employment)
initial_firm_capital: 100.0
initial_firm_inventory: 50.0
initial_individual_cash: 500.0  # flat fallback; age-based used at creation
initial_savings_at_retirement: 40000.0  # target bank deposits at age 65
initial_bank_reserves: 500000.0

# Consumption needs (units/person/month)
food_need: 1.0
energy_need: 1.0
shelter_need: 1.0
child_food_fraction: 0.5

# Initial prices (per unit) - near equilibrium to avoid spikes/collapses
initial_food_price: 400.0
initial_energy_price: 400.0
initial_shelter_price: 150.0  # monthly rent

# Housing
initial_housing_stock_per_capita: 1.05
shelter_rent_price: 150.0

# Housing construction
housing_construction_months: 6
housing_construction_cost_per_unit: 8640.0
housing_construction_workers_per_project: 2
housing_construction_vacancy_threshold: 0.10
housing_construction_max_starts_fraction: 0.05

# Labor market
job_separation_rate: 0.03  # monthly separation probability → ~3% frictional unemployment

# Wages (monthly)
initial_wage: 2400.0
min_wage: 600.0
wage_adjustment_speed: 0.06

# Price adjustment
price_adjustment_speed: 0.06  # slower for stability
target_inventory_months: 2.0

# Government / fiscal
income_tax_rate: 0.20
sales_tax_rate: 0.05
monthly_govt_transfer: 300.0
monthly_govt_spending: 150000.0

# Banking
interest_rate: 0.05
reserve_requirement: 0.10

# Firm equity & profit distribution
shares_per_firm: 1000  # shares outstanding per firm at creation
profit_distribution_rate: 0.50

# Demographics
retirement_age: 65
mortality_start_age: 72
target_death_age: 80
fertility_rate_annual: 0.02

# Pensions
pension_replacement_rate: 0.50

# Healthcare
childbirth_healthcare_fee: 5000.0
elder_healthcare_monthly_cost: 500.0

# Bonds
bond_duration_months: 120
bond_rate_min: 0.005
bond_rate_max: 0.15
bond_demand_sensitivity: 5.0
bond_savings_fraction: 0.3
